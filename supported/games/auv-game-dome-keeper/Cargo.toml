[package]
name = "auv-game-dome-keeper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
readme.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
auv = { path = "../../../crates/auv" }
auv-api-proto = { path = "../../../crates/auv-api-proto" }
auv-driver = { path = "../../../crates/auv-driver" }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
auv-inference-ort = { path = "../../../crates/auv-inference-ort", default-features = false, features = ["coreml"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
auv-inference-ort = { path = "../../../crates/auv-inference-ort", default-features = false }
