name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2025
    runs-on: ${{ matrix.os }}
    name: rust checks ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libclang-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl-dev \
            libleptonica-dev \
            libtesseract-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      # Regression: compile the Git checkout before any proto dependency export.
      # Generating vendor here previously hid missing files from cargo install --git.
      - run: cargo check
      - run: cargo test
      - run: cargo run --quiet -- invoke --help
      - run: git diff --check

  proto-vendor:
    name: verify vendored Protobuf ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Buf
        uses: bufbuild/buf-action@v1
        with:
          version: "1.71.0"
          setup_only: true
      - name: Install yq
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install yq --version 4.53.3 --yes --no-progress
      - name: Regenerate vendored Protobuf dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/generate-proto-vendor.ps1
      - name: Regenerate vendored Protobuf dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/generate-proto-vendor
      - name: Verify checked-in dependencies match buf.lock
        shell: bash
        run: |
          # Include untracked files: a new export must be committed too.
          changes=$(git status --porcelain --untracked-files=all -- proto/vendor)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            echo "Run scripts/generate-proto-vendor."
            exit 1
          fi

  cargo-package:
    name: package crates.io crates
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Package and compile registry archives
        run: |
          cargo package --locked \
            --package auv-api-proto \
            --package auv-cli-common-macros \
            --package auv-cli-invoke-macros \
            --package auv-driver-common \
            --package auv-inference-common \
            --package auv-query-readiness \
            --package auv-tracing \
            --package auv-api-client \
            --package auv-cli-common \
            --package auv-driver-linux \
            --package auv-driver-overlay-common \
            --package auv-inference-ort \
            --package auv-inference-ultralytics \
            --package auv-media-macos \
            --package auv-tracing-otel \
            --package auv-view \
            --package auv-driver-overlay-macos \
            --package auv-driver-overlay-windows \
            --package auv-task-object-detection \
            --package auv-driver-overlay \
            --package auv-driver-macos \
            --package auv-driver-windows \
            --package auv-driver \
            --package auv-core \
            --package auv-scan \
            --package auv-api-server \
            --package auv-cli-invoke \
            --package auv-daemon \
            --package auv-cli
